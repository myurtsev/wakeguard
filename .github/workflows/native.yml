name: Native macOS checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - name: Run native and installer checks and build
        run: ./app/build.sh "$RUNNER_TEMP/WakeGuard-build"
